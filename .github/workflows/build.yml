# Builds the app in the cloud (free on GitHub):
#  * Android: an installable test APK (demo mode, no Firebase needed)
#  * iOS: compile check (an installable iPhone app needs an Apple account)
# Download the APK under:  Actions -> latest run -> Artifacts
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project
        run: bash setup.sh
      - name: Google Maps key (optional repository secret MAPS_API_KEY)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s/YOUR_GOOGLE_MAPS_API_KEY/$MAPS_API_KEY/" android/app/src/main/AndroidManifest.xml
          fi
      - name: Analyze + tests (reports are stored on branch apk)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          flutter test > test-report.txt 2>&1 || true
          tail -60 test-report.txt
      - name: Build demo APK
        run: |
          # Demo uses fake_cloud_firestore, which refuses to run in release
          # builds -> build the demo as a debug APK (64-bit ARM phones).
          flutter build apk --debug --target-platform android-arm64 --dart-define=DEMO=true
          cp build/app/outputs/flutter-apk/app-debug.apk DragonBoatRunner-demo.apk
      - name: Build Firebase APK (only if lib/firebase_options.dart is configured)
        run: |
          if grep -q "flutterfire configure" lib/firebase_options.dart; then
            echo "Firebase not configured yet - skipped"
          else
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk DragonBoatRunner.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DragonBoatRunner-android
          path: |
            DragonBoatRunner-demo.apk
            DragonBoatRunner.apk
          if-no-files-found: warn
      # Easy download on the phone: GitHub -> Releases -> latest "Test build"
      - name: Publish as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          files: |
            DragonBoatRunner-demo.apk
            DragonBoatRunner.apk
          fail_on_unmatched_files: false
      # Keep the newest APK on branch "apk" (simple to fetch with git)
      - name: Store APK on branch apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/apk && cp DragonBoatRunner*.apk analyze.txt test-report.txt /tmp/apk/ 2>/dev/null || true
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "APK from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project
        run: bash setup.sh
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign --dart-define=DEMO=true
